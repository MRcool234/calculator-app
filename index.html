<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <div class="calculator">
        <div id="display">0</div>
          
          <button class="operator">+</button>
          <button class="number bold">7</button>
          <button class="number bold">8</button>
          <button class="number bold">9</button>

          <button class="operator">-</button>
          <button class="number bold">4</button>
          <button class="number bold">5</button>
          <button class="number bold">6</button>

          <button class="operator">*</button>
          <button class="number bold">1</button>
          <button class="number bold">2</button>
          <button class="number bold">3</button>
          
          <button class="operator">/</button>
          <button class="number bold">0</button>
          <button class="number bold">.</button>
          <button id="equalsBtn">=</button>

          <button id="clearBtn">C</button>

      </div>
    </main>
    <script src="index.js"></script>
  </body>
</html>
